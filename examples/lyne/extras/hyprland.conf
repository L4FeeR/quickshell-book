# The same setup for a classic hyprland.conf.
# Add:  source = ~/.config/quickshell/lyne/extras/hyprland.conf

exec-once = qs -c lyne
exec-once = wl-paste --watch cliphist store

# tap Super for the launcher (bindr = on release, only if no other key was pressed).
# A release bind would send the global shortcut as "released" only, so use IPC here.
bindr = SUPER, SUPER_L, exec, qs -c lyne ipc call launcher toggle
bind = SUPER, V, global, quickshell:clipboard_history
bind = , Print, global, quickshell:take_screenshot
bind = SUPER, End, global, quickshell:power_menu
bind = SUPER, Escape, global, quickshell:lock_screen
bind = SUPER, B, global, quickshell:wallpaper_picker
bind = SUPER, I, global, quickshell:settings
bind = SUPER, A, global, quickshell:dashboard
bind = SUPER, N, global, quickshell:notifications

bindel = , XF86AudioRaiseVolume, global, quickshell:volume_up
bindel = , XF86AudioLowerVolume, global, quickshell:volume_down
bindl  = , XF86AudioMute, global, quickshell:volume_mute
bindl  = , XF86AudioMicMute, global, quickshell:mic_mute
bindel = , XF86MonBrightnessUp, global, quickshell:brightness_up
bindel = , XF86MonBrightnessDown, global, quickshell:brightness_down

layerrule = blur, lyne_.*
layerrule = ignorealpha 0.45, lyne_.*
windowrule = float, title:^lyne settings$
