# ~/.config/hypr/look.conf: the same look for a classic hyprland.conf.
# Add:  source = ~/.config/hypr/look.conf

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg
    col.inactive_border = rgba(414868aa)
    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 4
    active_opacity = 1.0
    inactive_opacity = 0.94
    shadow {
        enabled = true
        range = 18
        render_power = 3
        offset = 0 4
        color = rgba(00000066)
    }
    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
        vibrancy = 0.2
        popups = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

animations {
    enabled = true
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = windowsIn, 1, 4, overshot, popin 80%
    animation = windowsOut, 1, 3, smoothOut, popin 80%
    animation = windowsMove, 1, 4, easeOut
    animation = border, 1, 8, easeOut
    animation = fade, 1, 4, easeOut
    animation = workspaces, 1, 5, easeOut, slidefade 15%
    animation = layers, 1, 4, easeOut, fade
}

windowrule = float, class:^(pavucontrol|nm-connection-editor|blueman-manager)$
windowrule = center, class:^(pavucontrol|nm-connection-editor|blueman-manager)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = opacity 0.97 0.92, class:^(kitty)$
