# ~/.config/starship.toml: a two-line "pill" prompt in Tokyo Night.
#
#  ╭─ ~/src/rice  main ✓      󰅐 14:58
#  ╰─❯

"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true

format = """
[╭─](fg:#414868)\
$os\
$directory\
$git_branch$git_status\
$fill\
$cmd_duration\
$python$nodejs$rust\
$time
[╰─](fg:#414868)$character"""

palette = "tokyonight"

[palettes.tokyonight]
bg = "#1a1b26"
surface = "#292e42"
blue = "#7aa2f7"
cyan = "#7dcfff"
green = "#9ece6a"
yellow = "#e0af68"
red = "#f7768e"
magenta = "#bb9af7"
muted = "#545c7e"

[os]
disabled = false
style = "fg:blue"
format = "[$symbol ]($style)"

[os.symbols]
Arch = ""
CachyOS = ""
EndeavourOS = ""
Linux = ""

[directory]
style = "bold fg:blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "fg:magenta"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:yellow"
format = "[$all_status$ahead_behind]($style) "

[fill]
symbol = " "

[cmd_duration]
min_time = 2000
style = "fg:yellow"
format = "[󰔛 $duration]($style) "

[python]
symbol = " "
style = "fg:yellow"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "fg:green"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "fg:red"
format = "[$symbol$version]($style) "

[time]
disabled = false
style = "fg:muted"
format = "[󰅐 $time]($style)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
