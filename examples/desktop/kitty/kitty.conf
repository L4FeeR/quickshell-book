# ~/.config/kitty/kitty.conf
# A riced kitty: Nerd Font, roomy padding, a see-through background that
# Hyprland blurs, a beam cursor with a trail, and tabs styled as pills.

# ── Font ─────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.0
# ligatures everywhere except under the cursor, so you can edit "->"
disable_ligatures cursor

# ── Window ───────────────────────────────────────────────────────────────
window_padding_width 14
background_opacity   0.88
# let the compositor blur what's behind the window
background_blur      1
hide_window_decorations yes
confirm_os_window_close 0
# always open at the size below, not the last window's size
remember_window_size no
initial_window_width  100c
initial_window_height 30c

# ── Cursor ───────────────────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.6
# a short smear when the cursor jumps (kitty 0.37+)
cursor_trail          3
cursor_trail_decay    0.1 0.4

# ── Tabs ─────────────────────────────────────────────────────────────────
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   round
tab_bar_margin_width  6
tab_title_template    " {index}: {title[:24]} "
active_tab_font_style bold

# ── Behaviour ────────────────────────────────────────────────────────────
scrollback_lines   10000
copy_on_select     yes
enable_audio_bell  no
url_style          curly
shell_integration  enabled

# ── Keys ─────────────────────────────────────────────────────────────────
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0

# ── Colours ──────────────────────────────────────────────────────────────
# A theme file, so switching themes never touches this file. The theming
# chapters (and the lyne shell) write current-theme.conf on every switch;
# until then it comes from `kitty +kitten themes`.
include current-theme.conf
