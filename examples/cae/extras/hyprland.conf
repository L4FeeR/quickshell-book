# Add to ~/.config/hypr/hyprland.conf (classic hyprlang syntax; see the book for Lua configs)
exec-once = qs -c cae

bind = SUPER, D, global, cae:dashboard
bind = SUPER, A, global, cae:sidebar
bind = SUPER, U, global, cae:utilities
bind = CTRL ALT, Delete, global, cae:session
bindr = SUPER, SUPER_L, global, cae:launcher      # tap Super to open the launcher
bind = SUPER, L, exec, qs -c cae ipc call lock lock
bind = SUPER, comma, global, cae:settings

# blur behind the frame when transparency is enabled in shell.json
layerrule = blur, cae-drawers
layerrule = ignorealpha 0.3, cae-drawers
