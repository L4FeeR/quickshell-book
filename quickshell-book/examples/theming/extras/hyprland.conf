# ~/.config/hypr/hyprland.conf
exec-once = qs -c theming

bind = SUPER, T, global, theming:picker           # open the theme picker
bind = SUPER SHIFT, T, global, theming:next       # next theme
bind = SUPER ALT, T, global, theming:toggleVariant # light <-> dark twin

# colours written by the theme switcher ($theme_primary, $theme_border, ...)
source = ~/.config/hypr/theming-colors.conf
