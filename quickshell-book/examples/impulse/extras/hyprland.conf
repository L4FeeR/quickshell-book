# Add to ~/.config/hypr/hyprland.conf (classic hyprlang syntax)
exec-once = qs -c impulse

bind = SUPER, Tab, global, impulse:overviewToggle
bind = SUPER, N, global, impulse:sidebarRightToggle
bind = SUPER, A, global, impulse:sidebarLeftToggle
bind = SUPER, L, exec, qs -c impulse ipc call lock activate
bind = CTRL ALT, Delete, exec, qs -c impulse ipc call session toggle
# hold Super to see workspace numbers: i = ignore other modifiers, t = transparent
# (Super still works for your other binds). end-4 binds the press and the release separately.
bindit = , SUPER_L, global, impulse:workspaceNumber
bindirt = , SUPER_L, global, impulse:workspaceNumber
# tap Super (press and release alone) to open the overview search, like end-4
bindr = SUPER, SUPER_L, global, impulse:overviewToggle

layerrule = blur, quickshell:.*
layerrule = ignorealpha 0.5, quickshell:.*
layerrule = noanim, quickshell:(overview|onScreenDisplay|screenCorners)
